<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: lightblue;
        }
        .media-container {
            margin: 20px auto;
            width: 500px;
        }
        video, audio {
            width: 100%;
        }
        .time {
            margin-top: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>HTML5 Audio Player</h2>
    <div class="media-container">
        <audio id="audioPlayer" controls>
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <div class="time">Current Time: <span id="audioTime">0.00</span> seconds</div>
    </div>
    <h2>HTML5 Video Player</h2>
    <div class="media-container">
        <video id="videoPlayer" controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video element.
        </video>
        <div class="time">Current Time: <span id="videoTime">0.00</span> seconds</div>
    </div>
    <script>
        const audio = document.getElementById("audioPlayer");
        const video = document.getElementById("videoPlayer");

        const audioTime = document.getElementById("audioTime");
        const videoTime = document.getElementById("videoTime");
        audio.addEventListener("timeupdate", () => {
            audioTime.textContent = audio.currentTime.toFixed(2);
        });
        video.addEventListener("timeupdate", () => {
            videoTime.textContent = video.currentTime.toFixed(2);
        });
    </script>
</body>
</html>
