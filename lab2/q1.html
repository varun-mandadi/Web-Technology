<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(225, 245, 220);
        }
        canvas {
            border: 1px solid black;
            background-color: rgb(220, 242, 245);
        }
    </style>
</head>
<body>
<canvas id="myCanvas" width="500" height="300"></canvas>
<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "blue";
    ctx.fillRect(30, 30, 200, 100);
    ctx.beginPath();
    ctx.arc(400,100, 70, 0, 2 * Math.PI);
    ctx.fillStyle = "red";
    ctx.fill();
    ctx.closePath();
    ctx.beginPath();
    ctx.moveTo(20, 200);
    ctx.lineTo(480, 200);
    ctx.strokeStyle = "navy";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.closePath();
    ctx.font = "30px Arial";
    ctx.fillStyle = "black";
    ctx.fillText("HTML5 Canvas", 170, 260);
</script>
</body>
</html>
