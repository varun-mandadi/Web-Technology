<!DOCTYPE html>
<html>
<head>
<title>Student Notes Manager</title>
<style>
body{
font-family: Arial, Helvetica, sans-serif;
background: linear-gradient(135deg,#74ebd5,#9face6);
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.container{
width:450px;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);
text-align:center;
}
h2{
margin-bottom:15px;
color:#333;
}
input, textarea{
width:90%;
padding:10px;
margin:8px;
border-radius:5px;
border:1px solid #ccc;
font-size:14px;
}
textarea{
resize:none;
height:60px;
}
button{
padding:8px 15px;
margin:5px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:14px;
}
.addBtn{
background:#4CAF50;
color:white;
}
.addBtn:hover{
background:#45a049;
}
.editBtn{
background:#2196F3;
color:white;
}
.editBtn:hover{
background:#1976D2;
}
.deleteBtn{
background:#f44336;
color:white;
}
.deleteBtn:hover{
background:#d32f2f;
}
.note{
background:#f9f9f9;
border-left:5px solid #4CAF50;
padding:10px;
margin-top:10px;
border-radius:5px;
text-align:left;
}
.note h4{
margin:0;
color:#333;
}
.note p{
margin:4px 0;
font-size:14px;
}
</style>
</head>
<body>
<div class="container">
<h2>📚 Student Notes Manager</h2>
<input id="title" placeholder="Title"><br>
<input id="subject" placeholder="Subject"><br>
<textarea id="description" placeholder="Description"></textarea><br>
<button class="addBtn" onclick="addNote()">Add / Update Note</button>
<hr>
<h3>All Notes</h3>
<div id="notesList"></div>
</div>
<script>
let editId=null;
function addNote(){
let noteData={
title:document.getElementById("title").value,
subject:document.getElementById("subject").value,
description:document.getElementById("description").value
};
if(editId){
fetch("http://localhost:3000/notes/"+editId,{
method:"PUT",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(noteData)
})
.then(res=>res.json())
.then(data=>{
alert("Note Updated");
editId=null;
loadNotes();
});
}
else{
fetch("http://localhost:3000/notes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(noteData)
})
.then(res=>res.json())
.then(data=>{
alert("Note Added");
loadNotes();
});
}
}
function loadNotes(){
fetch("http://localhost:3000/notes")
.then(res=>res.json())
.then(data=>{
let output="";
data.forEach(note=>{
output+=`
<div class="note">
<h4>${note.title}</h4>
<p><b>Subject:</b> ${note.subject}</p>
<p>${note.description}</p>
<button class="editBtn"
onclick="editNote('${note._id}','${note.title}','${note.subject}','${note.description}')">
Edit
</button>
<button class="deleteBtn"
onclick="deleteNote('${note._id}')">
Delete
</button>
</div>
`;
});
document.getElementById("notesList").innerHTML=output;
});
}
function deleteNote(id){
fetch("http://localhost:3000/notes/"+id,{
method:"DELETE"
})
.then(res=>res.json())
.then(data=>{
alert("Note Deleted");
loadNotes();
});
}
function editNote(id,title,subject,description){
document.getElementById("title").value=title;
document.getElementById("subject").value=subject;
document.getElementById("description").value=description;
editId=id;
}
loadNotes();
</script>
</body>
</html>
