<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Object Example</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 340px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 6px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #5a67d8;
        }
        .result-box {
            margin-top: 15px;
            padding: 10px;
            background: #f4f4f4;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Student Details</h2>
    <input type="number" id="id" placeholder="Enter ID">
    <input type="text" id="name" placeholder="Enter Name">
    <input type="text" id="dept" placeholder="Enter Department">
    <input type="number" id="marks" placeholder="Enter Marks">
    <button onclick="processData()">Submit</button>
    <div class="result-box" id="output"></div>
</div>
<script src="script.js"></script>
</body>
</html>
