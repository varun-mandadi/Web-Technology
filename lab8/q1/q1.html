<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Marks Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4ffea4, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #007bff;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Marks Calculator</h2>
    <input type="text" id="name" placeholder="Enter Student Name">
    <input type="number" id="m1" placeholder="Enter Mark 1">
    <input type="number" id="m2" placeholder="Enter Mark 2">
    <input type="number" id="m3" placeholder="Enter Mark 3">
    <button onclick="calculate()">Calculate</button>
    <div class="result" id="result"></div>
</div>
<script src="script.js"></script>
</body>
</html>
