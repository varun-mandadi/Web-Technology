<!DOCTYPE html>
<html lang="en">
<head>
    <title>Course Enrollment System</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #ff7e5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Course Enrollment</h2>
    <input type="text" id="course" placeholder="Enter Course Name">
    <input type="text" id="instructor" placeholder="Enter Instructor Name">
    <button onclick="enroll()">Enroll</button>
    <div class="result" id="output"></div>
</div>
<script src="script.js"></script>
</body>
</html>
