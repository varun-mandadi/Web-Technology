<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi-Stage Form Workflow</title>
<style>
*{
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}
body{
    margin: 0;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.container{
    width: 800px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    padding: 30px;
}
h2{
    text-align: center;
    margin-bottom: 15px;
}
.progress-container{
    background: #eee;
    border-radius: 20px;
    height: 10px;
    margin-bottom: 30px;
}
.progress{
    height: 100%;
    width: 25%;
    background: linear-gradient(135deg,#667eea,#764ba2);
    border-radius: 20px;
    transition: width 0.4s;
}
.step{
    display: none;
}
.step.active{
    display: block;
}
.field{
    margin-bottom: 20px;
}
.field label{
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
}
.field input, .field select{
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}
.error{
    color: #e53935;
    font-size: 13px;
    margin-top: 4px;
}
.buttons{
    display: flex;
    justify-content: space-between;
}
button{
    padding: 10px 22px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color: white;
    cursor: pointer;
}
.success{
    text-align: center;
    font-size: 18px;
    color: #2e7d32;
}
</style>
</head>
<body>
<div class="container">
<h2>🧾 Multi-Stage Registration</h2>
<div class="progress-container">
    <div class="progress" id="progress"></div>
</div>
<div class="step active">
    <div class="field">
        <label>Full Name</label>
        <input type="text" id="name">
        <div class="error"></div>
    </div>
    <div class="field">
        <label>Email</label>
        <input type="email" id="email">
        <div class="error"></div>
    </div>
</div>
<div class="step">
    <div class="field">
        <label>Password</label>
        <input type="password" id="password">
        <div class="error"></div>
    </div>
    <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="confirm">
        <div class="error"></div>
    </div>
</div>
<div class="step">
    <div class="field">
        <label>Age</label>
        <input type="number" id="age">
        <div class="error"></div>
    </div>
    <div class="field">
        <label>Role</label>
        <select id="role">
            <option value="">Select</option>
            <option>Student</option>
            <option>Teacher</option>
            <option>Admin</option>
        </select>
        <div class="error"></div>
    </div>
</div>
<div class="step">
    <div class="field">
        <label>Skills</label>
        <input type="text" id="skills">
        <div class="error"></div>
    </div>
    <div class="success">✔ All steps completed</div>
</div>
<div class="buttons">
    <button onclick="prevStep()">Back</button>
    <button onclick="nextStep()">Next</button>
</div>
</div>
<script>
let currentStep = 0;
const steps = document.querySelectorAll(".step");
const progress = document.getElementById("progress");
let formData = {};
function showStep(){
    steps.forEach((s,i)=> s.classList.toggle("active", i === currentStep));
    progress.style.width = ((currentStep + 1) / steps.length) * 100 + "%";
}
function validateStep(){
    let valid = true;
    steps[currentStep].querySelectorAll(".error").forEach(e=>e.innerText="");
    const name = document.getElementById("name");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirm = document.getElementById("confirm");
    const age = document.getElementById("age");
    const role = document.getElementById("role");
    const skills = document.getElementById("skills");
    if(currentStep === 0){
        if(name.value.trim()===""){
            name.nextElementSibling.innerText="Name required";
            valid=false;
        }
        if(!email.value.includes("@")){
            email.nextElementSibling.innerText="Valid email required";
            valid=false;
        }
        formData.name=name.value;
        formData.email=email.value;
    }
    if(currentStep === 1){
        if(password.value.length<6){
            password.nextElementSibling.innerText="Min 6 characters";
            valid=false;
        }
        if(password.value!==confirm.value){
            confirm.nextElementSibling.innerText="Passwords do not match";
            valid=false;
        }
        formData.password=password.value;
    }
    if(currentStep === 2){
        if(age.value<18){
            age.nextElementSibling.innerText="Age must be 18+";
            valid=false;
        }
        if(role.value===""){
            role.nextElementSibling.innerText="Select role";
            valid=false;
        }
        formData.age=age.value;
        formData.role=role.value;
    }
    if(currentStep === 3){
        if(skills.value.trim()===""){
            skills.nextElementSibling.innerText="Enter skills";
            valid=false;
        }
        formData.skills=skills.value;
    }
    return valid;
}
function nextStep(){
    if(!validateStep()) return;
    if(currentStep < steps.length-1){
        currentStep++;
        showStep();
    }else{
        alert("Form Submitted!\n\n"+JSON.stringify(formData,null,2));
    }
}
function prevStep(){
    if(currentStep>0){
        currentStep--;
        showStep();
    }
}
showStep();
</script>
</body>
</html>
