<!DOCTYPE html>
<html>
<head>
    <title>Middleware Demo</title>
</head>
<body>
    <h1>Middleware Example</h1>
    <button onclick="load()">Call Server</button>
    <p id="output"></p>
    <script>
        function load() {
            fetch('/about')
                .then(res => res.text())
                .then(data => {
                    document.getElementById('output').innerText = data;
                });
        }
    </script>
</body>
</html>
