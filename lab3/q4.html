<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Activity Monitor</title>
<style>
*{
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}
body{
    margin: 0;
    background: linear-gradient(135deg,#1d2671,#c33764);
    min-height: 100vh;
    color: #333;
}
.header{
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 18px 30px;
    font-size: 22px;
    font-weight: bold;
}
.container{
    max-width: 1100px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
}
h2{
    text-align: center;
    margin-bottom: 20px;
}
.playground{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 25px;
}
.box{
    padding: 20px;
    border-radius: 10px;
    background: #f4f6f9;
    border: 2px dashed #ccc;
}
.box h3{
    margin-top: 0;
}
input, button{
    padding: 10px;
    margin-top: 10px;
    width: 100%;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}
.actions{
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
}
.actions button{
    flex: 1;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color: white;
    border: none;
    cursor: pointer;
}
.actions button:hover{
    opacity: 0.9;
}
.log{
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    background: #fafafa;
}
.log-entry{
    font-size: 13px;
    padding: 6px;
    border-bottom: 1px solid #eee;
}
.warning{
    background: #fff3cd;
    color: #856404;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 15px;
    display: none;
}
.footer{
    text-align: center;
    margin-top: 20px;
    color: #666;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="header">🛡️ Real-Time User Activity Monitor</div>
<div class="container">
    <h2>Live Activity Tracking Dashboard</h2>
    <div class="warning" id="warningBox">
        ⚠️ Suspicious activity detected: Too many clicks!
    </div>
    <div class="playground">
        <div class="box">
            <h3>Interactive Area</h3>
            <p>Click, type, or focus on elements below.</p>
            <input type="text" placeholder="Focus & type here">
            <button>Click Me</button>
        </div>
        <div class="box">
            <h3>Another Section</h3>
            <input type="text" placeholder="Another input">
            <button>Another Button</button>
        </div>
    </div>
    <div class="actions">
        <button onclick="resetLog()">Reset Log</button>
        <button onclick="exportLog()">Export Log</button>
    </div>
    <div class="log" id="log"></div>
    <p class="footer">Monitoring clicks, key presses & focus events in real time</p>
</div>
<script>
let activityLog = [];
let clickCount = 0;
const CLICK_THRESHOLD = 10;
function logActivity(type, target, phase){
    const activity = {
        type,
        target,
        phase,
        time: new Date().toLocaleTimeString()
    };
    activityLog.push(activity);
    updateUI(activity);
    if(type === "Click"){
        clickCount++;
        if(clickCount >= CLICK_THRESHOLD){
            document.getElementById("warningBox").style.display = "block";
        }
    }
}
function updateUI(activity){
    const logDiv = document.getElementById("log");
    const entry = document.createElement("div");
    entry.className = "log-entry";
    entry.innerText = `[${activity.time}] ${activity.type} on <${activity.target}> (${activity.phase})`;
    logDiv.prepend(entry);
}
document.addEventListener("click", e => {
    logActivity("Click", e.target.tagName, "Bubbling");
}, false);
document.addEventListener("click", e => {
    logActivity("Click", e.target.tagName, "Capturing");
}, true);
document.addEventListener("keydown", e => {
    logActivity("Key Press", e.key, "Bubbling");
});
document.addEventListener("focusin", e => {
    logActivity("Focus", e.target.tagName, "Bubbling");
});
function resetLog(){
    activityLog = [];
    clickCount = 0;
    document.getElementById("log").innerHTML = "";
    document.getElementById("warningBox").style.display = "none";
}
function exportLog(){
    let text = "USER ACTIVITY LOG\n\n";
    activityLog.forEach(a => {
        text += `[${a.time}] ${a.type} on ${a.target} (${a.phase})\n`;
    });
    const blob = new Blob([text], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "activity_log.txt";
    link.click();
}
</script>
</body>
</html>
