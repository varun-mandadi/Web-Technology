<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Shopping Cart</title>
<style>
*{
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}
body{
    margin: 0;
    background: linear-gradient(135deg,#eef2f3,#d9e4f5);
    min-height: 100vh;
}
.navbar{
    background: #2d3e50;
    color: white;
    padding: 15px 30px;
    font-size: 22px;
    font-weight: bold;
}
.container{
    max-width: 900px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
h2{
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}
table{
    width: 100%;
    border-collapse: collapse;
}
thead{
    background: #f1f4f8;
}
th, td{
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}
th{
    color: #555;
}
tbody tr:hover{
    background: #f9fbff;
}
input[type="number"]{
    width: 70px;
    padding: 5px;
    text-align: center;
}
button{
    padding: 7px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background: #4a6cf7;
    color: white;
    transition: 0.3s;
}
button:hover{
    background: #3b5bdb;
}
.remove-btn{
    background: #e53935;
}
.remove-btn:hover{
    background: #c62828;
}
.coupon-box{
    display: flex;
    gap: 10px;
    margin-top: 20px;
}
.coupon-box input{
    flex: 1;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}
.summary{
    margin-top: 25px;
    padding: 20px;
    background: #f7f9fc;
    border-radius: 8px;
}
.summary p{
    margin: 6px 0;
    font-size: 16px;
}
.discount{
    color: #2e7d32;
    font-weight: bold;
}
.total{
    font-size: 22px;
    font-weight: bold;
    color: #1a237e;
    margin-top: 10px;
}
.footer{
    text-align: center;
    margin-top: 30px;
    color: #666;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="navbar">🛍 SmartCart</div>
<div class="container">
<h2>Your Shopping Cart</h2>
<table>
    <thead>
        <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price (₹)</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="cartBody"></tbody>
</table>
<div class="coupon-box">
    <input type="text" id="couponCode" placeholder="Enter Coupon Code">
    <button onclick="applyCoupon()">Apply Coupon</button>
</div>
<div class="summary">
    <p class="discount" id="discountInfo"></p>
    <p class="total">Total: ₹<span id="total">0</span></p>
</div>
</div>
<div class="footer">
    © 2026 SmartCart • Intelligent Shopping System
</div>
<script>
let products = [
    { name: "Laptop", price: 50000, quantity: 1, category: "electronics" },
    { name: "Shirt", price: 1500, quantity: 2, category: "clothing" },
    { name: "Book", price: 500, quantity: 3, category: "education" }
];
let couponDiscount = 0;
function renderCart(){
    const body = document.getElementById("cartBody");
    body.innerHTML = "";
    products.forEach((p, index) => {
        body.innerHTML += `
            <tr>
                <td>${p.name}</td>
                <td>${p.category}</td>
                <td>${p.price}</td>
                <td>
                    <input type="number" min="1" value="${p.quantity}"
                    onchange="updateQuantity(${index}, this.value)">
                </td>
                <td>
                    <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                </td>
            </tr>
        `;
    });
    calculateTotal();
}
function updateQuantity(index, qty){
    products[index].quantity = parseInt(qty);
    calculateTotal();
}
function removeItem(index){
    products.splice(index,1);
    renderCart();
}
function calculateTotal(){
    let total = 0;
    let discount = 0;
    products.forEach(p => {
        let price = p.price * p.quantity;
        total += price;
        if(p.quantity >= 5){
            discount += price * 0.10;
        }
        if(p.category === "electronics"){
            discount += price * 0.05;
        }
    });
    let hour = new Date().getHours();
    if(hour >= 18 && hour <= 21){
        discount += total * 0.05;
    }
    discount += couponDiscount;
    document.getElementById("total").innerText =
        Math.max(total - discount, 0).toFixed(2);
    document.getElementById("discountInfo").innerText =
        discount > 0 ? `Discount Applied: ₹${discount.toFixed(2)}` : "";
}
function applyCoupon(){
    let code = document.getElementById("couponCode").value.trim().toUpperCase();
    couponDiscount = 0;

    if(code.startsWith("SAVE") && code.length === 6){
        couponDiscount = 200;
        alert("₹200 Coupon Applied");
    }
    else if(code === "STUDENT10"){
        couponDiscount = getCartTotal() * 0.10;
        alert("10% Student Discount Applied");
    }
    else{
        alert("Invalid Coupon Code");
    }
    calculateTotal();
}
function getCartTotal(){
    return products.reduce((sum,p)=> sum + p.price*p.quantity, 0);
}
renderCart();
</script>
</body>
</html>
